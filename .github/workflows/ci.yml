name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set image variables
        run: |
          IMAGE_OWNER="${{ secrets.DOCKER_USERNAME }}"
          if [ -z "$IMAGE_OWNER" ]; then
            IMAGE_OWNER="local"
          fi

          IMAGE_NAME="$IMAGE_OWNER/${{ github.event.repository.name }}"

          {
            echo "IMAGE_NAME=$IMAGE_NAME"
            echo "IMAGE_TAGS<<EOF"
            echo "$IMAGE_NAME:sha-${GITHUB_SHA}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "$IMAGE_NAME:latest"
            fi
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "$IMAGE_NAME:pr-${{ github.event.pull_request.number }}"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
          tags: ${{ env.IMAGE_TAGS }}
